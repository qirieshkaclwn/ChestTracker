services:
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_TOKEN=${API_TOKEN}
    # This allows the container to connect to a DB running on the host machine
    # using the hostname 'host.docker.internal'
    extra_hosts:
      - "host.docker.internal:host-gateway"
